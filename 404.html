<style>
/* ═══ BASE · tokens + shared base ════════════════════════════════════
   Source of truth for the design system. tools/build-css.mjs copies it
   into every page between the GEN:BASECSS markers: index.html gets the
   whole file, the other four pages get the TOKENS section only. Edit
   here, then run: node tools/build-css.mjs
   Strictly black, white and grey. No hue, anywhere. */

/* ═══ TOKENS ════════════════════════════════════════════════════════ */
:root{
  /* colour. --text is body copy; --dim is captions and labels only */
  --bg:#0a0a0a;
  --fg:#f4f4f1;
  --text:#c9c9c4;
  --dim:#8f8f8a;
  --faint:#3a3a37;
  --line:#32322f;
  --line-strong:#4a4a46;
  --card:#0f0f0e;
  /* heatmap steps, low to high. A cell with no level stays transparent */
  --heat-0:#1a1a19;
  --heat-1:var(--faint);
  --heat-2:#60605a;
  --heat-3:#9a9a94;
  --heat-4:var(--fg);
  /* overlays: [G] grid, lightbox scrim, field canvas dots */
  --grid-line:rgba(255,255,255,.07);
  --scrim:rgba(10,10,10,.97);
  --dot:#f4f4f1;
  --dot-still:rgba(244,244,241,.07);
  /* the shutter flash and the photo reticle are white in both modes */
  --flash:#fff;
  /* photo placeholders and vignette: photos stay positive in both modes */
  --ph-glow:rgba(255,255,255,.16);
  --ph-a:#101010;
  --ph-b:#0c0c0c;
  --ph-frame:#0e0e0d;
  --vignette:rgba(0,0,0,.55);
  --halftone:rgba(0,0,0,.4);

  /* type. 11px is a hard floor: nothing renders smaller, media queries
     and print included. cap/meta are px (mono labels); the rest are rem
     so the print sheet's smaller root still scales them */
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Inter Tight','Helvetica Neue',sans-serif;
  --t-cap:11px;
  --t-meta:12.5px;
  --t-small:.9375rem;    /* 15px */
  --t-body:1.0625rem;    /* 17px */
  --t-lead:1.3125rem;    /* 21px */
  --t-title:1.6rem;      /* project card titles */
  --t-h3:clamp(1.5rem,3vw,2.3rem);
  --t-big:clamp(1.9rem,4.6vw,3.9rem);
  --t-hero:clamp(2.3rem,6.2vw,5.2rem);
  --tr-display:-.03em;
  --tr-body:0;
  --tr-cap:.12em;
  --lh-display:1;
  --lh-title:1.35;
  --lh-body:1.7;
  --lh-list:2.15;

  /* space */
  --s1:4px;
  --s2:8px;
  --s3:12px;
  --s4:16px;
  --s5:24px;
  --s6:32px;
  --s7:48px;
  --s8:72px;
  /* minimum touch target: every control reaches it on coarse pointers and
     phone widths, by growing or by an invisible hit area */
  --tap:44px;

  /* viewfinder brackets: arm length and weight */
  --vf-arm:16px;
  --vf-arm-lg:24px;
  --vf-weight:2px;

  /* stacking, low to high */
  --z-field:0;
  --z-content:1;
  --z-topbar:100;
  --z-tip:200;
  --z-grid:8999;
  --z-grain:9000;
  --z-exp:9200;
  --z-shutter:9300;
  --z-snap:9400;
  --z-lb:9500;
  --z-cursor:9600;
  --z-top:9999;

  /* motion */
  --dur-fast:.15s;
  --dur-quick:.2s;
  --dur-base:.25s;
  --dur-mid:.35s;
  --dur-slow:.4s;
  --dur-flash:.5s;
  --dur-develop:.7s;
  --ease-shutter:cubic-bezier(.65,0,.35,1);
  --ease-develop:cubic-bezier(.2,.7,.3,1);

  /* breakpoints, written as literals in @media because custom properties
     cannot be used there: 560 (phone), 860 (tablet), 1100 (reserved).
     700 survives in two places: the topbar's .hide-m, and the
     constellation crop, which the script also tests at 700. */
}
/* negative-film mode: toggle with [D]. Every value mirrors its dark
   counterpart at the same contrast against the background. */
body.negative{
  --bg:#f2f2ef;
  --fg:#0d0d0c;
  --text:#2f2f2b;
  --dim:#5b5b57;
  --faint:#babab5;
  --line:#c5c5c0;
  --line-strong:#a4a49f;
  --card:#eaeae6;
  --heat-0:#e4e4e0;
  --heat-1:var(--faint);
  --heat-2:#898985;
  --heat-3:#52524e;
  --heat-4:var(--fg);
  --grid-line:rgba(0,0,0,.07);
  --scrim:rgba(242,242,239,.97);
  --dot:#0d0d0c;
  --dot-still:rgba(13,13,12,.07);
}
/* ═══ END TOKENS ════════════════════════════════════════════════════ */
</style>
<!-- /GEN:BASECSS -->
<style>
/* Tokens arrive in the GEN:BASECSS block above, from tools/base.css. */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--mono);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;text-align:center;padding:var(--s5);
  -webkit-font-smoothing:antialiased;
}
.vf{
  position:relative;width:320px;height:220px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.vf::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(var(--fg),var(--fg)) left 0 top 0/var(--vf-arm-lg) var(--vf-weight),
    linear-gradient(var(--fg),var(--fg)) left 0 top 0/var(--vf-weight) var(--vf-arm-lg),
    linear-gradient(var(--fg),var(--fg)) right 0 top 0/var(--vf-arm-lg) var(--vf-weight),
    linear-gradient(var(--fg),var(--fg)) right 0 top 0/var(--vf-weight) var(--vf-arm-lg),
    linear-gradient(var(--fg),var(--fg)) left 0 bottom 0/var(--vf-arm-lg) var(--vf-weight),
    linear-gradient(var(--fg),var(--fg)) left 0 bottom 0/var(--vf-weight) var(--vf-arm-lg),
    linear-gradient(var(--fg),var(--fg)) right 0 bottom 0/var(--vf-arm-lg) var(--vf-weight),
    linear-gradient(var(--fg),var(--fg)) right 0 bottom 0/var(--vf-weight) var(--vf-arm-lg);
  background-repeat:no-repeat;
}
/* the h1 keeps its own clamp and open tracking on purpose */
h1{
  font-family:var(--disp);
  font-weight:900;font-size:clamp(1.4rem,4vw,2rem);
  letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:var(--s4);
}
.label{
  font-size:var(--t-cap);letter-spacing:var(--tr-cap);text-transform:uppercase;
  color:var(--dim);margin-bottom:var(--s5);
}
a{
  font-size:var(--t-cap);letter-spacing:var(--tr-cap);text-transform:uppercase;
  color:var(--fg);border-bottom:1px solid var(--faint);
  text-decoration:none;transition:border-color var(--dur-quick);
}
a:hover{border-color:var(--fg)}
/* A dead end is a wasted crawl and a wasted visit. The nav below is the
   only outbound path off this page, so it names every other page. */
.nav{display:flex;gap:var(--s5);justify-content:center;flex-wrap:wrap;margin-top:var(--s6)}
/* the site's focus ring: this page takes the tokens, not the shared base */
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
/* tap targets on touch and phone widths: every link gets an invisible
   hit area centred on it, so nothing in the frame moves */
@media screen and (pointer:coarse),screen and (max-width:560px){
  a{position:relative}
  a::after{
    content:"";position:absolute;left:50%;top:50%;
    width:max(100%,var(--tap));height:max(100%,var(--tap));transform:translate(-50%,-50%);
  }
}
</style>
